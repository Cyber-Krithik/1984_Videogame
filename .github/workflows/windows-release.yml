name: Build desktop releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install game and packaging dependencies
        run: python -m pip install pygame==2.6.1 pyinstaller

      - name: Package executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name 1984-Videogame main.py

      - name: Attach executable to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/1984-Videogame.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install game and packaging dependencies
        run: python -m pip install pygame==2.6.1 pyinstaller

      - name: Package Apple silicon app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name 1984-Videogame --collect-all pygame main.py
          ditto -c -k --sequesterRsrc --keepParent dist/1984-Videogame.app dist/1984-Videogame-macos-arm64.zip

      - name: Attach app to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/1984-Videogame-macos-arm64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
